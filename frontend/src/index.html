<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend example</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .value-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .value-row p {
      margin: 0;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input, button {
      padding: 10px;
      font: inherit;
    }

    input {
      flex: 1;
      min-width: 0;
    }
  </style>
</head>
<body>
  <h1>Frontend for DB interaction</h1>

  <h2>Get the stored number</h2>
  <div class="value-row">
    <p>Retrieved value: <span id="output">Nothing yet</span></p>
    <button id="get" type="button">Get value</button>
  </div>

  <h2>Update the number</h2>
  <form id="put">
    <input
      type="number"
      id="input"
      placeholder="0"
      required
    >
    <button type="submit">Update</button>
  </form>


  <script>
    const get = document.querySelector("#get");
    const form = document.querySelector("#put");
    const input = document.querySelector("#input");
    const output = document.querySelector("#output");
    const URL = "http://localhost:5000/number";

    // Get current number
    get.addEventListener("click", async () => {
      try {
        const response = await fetch(URL);

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error ?? `HTTP ${response.status}`);
        }

        output.textContent = data.number;
      } catch (error) {
        console.error("Failed to retrieve number:", error);
        output.textContent = "Failed to retrieve value";
      }
    });

    // Send new number
      form.addEventListener("submit", async (event) => {
      event.preventDefault();

      try {
        const response = await fetch(URL, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            number: Number(input.value)
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error ?? `HTTP ${response.status}`);
        }

        output.textContent = data.success;
      } catch (error) {
        console.error("Failed to update number:", error);
        output.textContent = "Failed to update value";
      }
    });
    </script>
</body>
</html>
