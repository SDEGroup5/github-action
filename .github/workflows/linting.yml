name: Quality & Formatting Checks

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry ruff yapf

      - name: Run ruff check
        run: |
          ruff check frontend/ backend/

      - name: Check yapf formatting
        run: |
          yapf --in-place --parallel --recursive backend/*/* frontend/*/*
          git diff --exit-code
