name: Quality & Formatting Checks

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry ruff yapf pylint

      - name: Run ruff check
        run: |
          ruff check frontend/ backend/

      - name: Check yapf formatting
        run: |
          yapf --in-place --parallel --recursive */*/*.py
          git diff --exit-code

      - name: Check pylint score
        run: |
          PYLINT_OUTPUT=$(PYTHONPATH=. pylint -r y */*/*.py) || true
          THRESHOLD=9.95
          echo "$PYLINT_OUTPUT"
          
          SCORE=$(echo "$PYLINT_OUTPUT" | awk -F'rated at ' '/rated at/ {split($2, a, "/"); print a[1]}')
          
          if [ -z "$SCORE" ]; then
            exit 1
          fi
          
          echo "Pylint score: $SCORE"
          
          python3 -c "import sys; score=float(sys.argv[1]); sys.exit(0 if score >= $THRESHOLD else 1)" "$SCORE"
