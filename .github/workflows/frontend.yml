name: frontend Docker Image

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image version
        id: image-version
        # If it's a release, use the tag as the version,
        # otherwise use the short SHA of the commit
        run: |
          if [ -n "$GITHUB_TAG" ]; then
            echo "IMAGE_VERSION=$GITHUB_TAG" >> $GITHUB_ENV
          else
            echo "IMAGE_VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi
        
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ env.IMAGE_VERSION }}
